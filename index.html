      try {
        if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
          let _fetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(newFetch) {
              _fetch = typeof newFetch === 'function' ? newFetch.bind(window) : newFetch;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // Fallback silently if environment forbids property redefinition
      }
